<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Portifólio - Eduardo Jochem</title>
  <style>
    
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    
    
    #botaoReiniciar{ 
      margin-top: 20px;
      padding: 15px;

    }
    
    
    .tabuleiro {
      display: grid;
      grid-template-columns: repeat(3,100px);
      gap: 10px;
    }

    .celula { 
      display: flex;
      background-color: #696969;
      width: 100px;
      height: 100px;
      justify-content: center;
      align-items: center;
      font-size: 46px;
      cursor: pointer;

    }

  </style>
   
    </head>
<body>
  <header> 

    <h1>Jogo da Velha</h1>
  </header>
  <main>
    <div id="tabuleiro-jogo" class="tabuleiro">
      <button class="celula"></button>
      <button class="celula"></button>
      <button class="celula"></button>
      <button class="celula"></button>
      <button class="celula"></button>
      <button class="celula"></button>
      <button class="celula"></button>
      <button class="celula"></button>
      <button class="celula"></button>

    </div>

    
    <button id="botaoReiniciar">Reiniciar o Jogo</button>
    

  </main>
<script src="script.js"></script>
</body>
</html>
